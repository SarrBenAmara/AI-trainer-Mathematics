<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Teach My AI – Mathematics Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>/*
VOICE: friendly AI lab for 11–14 year olds, clear and calm, never childish.
IDEA: a lab bench: rounded instrument cards, a robot learner that changes state.
PICTURE: the robot + Mrs Sarra persona on the hero; live plots and step cards inside labs.
COLOUR and TYPE: white ground, deep navy, electric blue, purple, yellow for instructions. Lexend.
LAYOUT: left navigation rail on desktop, bottom tab bar on phones; two-column lab cards that stack.
*/
:root{color-scheme:light;--bg:#f6f8ff;--card:#fff;--ink:#0b1d4f;--mut:#51608a;--blue:#2f6bff;--blue2:#1747c9;--pur:#7c3aed;--pur2:#5b21b6;--yel:#ffd23f;--yel2:#fff6cf;--good:#15803d;--goodb:#dcfce7;--bad:#b45309;--badb:#fef3c7;--red:#dc2626;--line:#dde4f7;--r:18px}
:root[data-theme=dark],:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Lexend,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{line-height:1.15;margin:0 0 .5em;text-wrap:balance}
h1{font-size:clamp(28px,4vw,40px)}h2{font-size:20px}h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:44px;width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #a5b4fc;outline-offset:1px;border-color:var(--blue)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.small{font-size:13.5px}.muted{color:var(--mut)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#0b1d4f,#16246b 60%,#2a1a6b);color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;font-size:13px;line-height:1.2;text-transform:uppercase}
.mark{width:44px;height:44px;flex:none;background:linear-gradient(135deg,var(--pur),var(--blue));border-radius:12px;padding:4px}.brand small{font-weight:500;text-transform:none;color:#c7d2fe}
.side nav{display:flex;flex-direction:column;gap:6px}
.nav{display:flex;align-items:center;gap:10px;background:transparent;border:1.5px solid transparent;color:#dbe4ff;padding:10px 12px;border-radius:14px;cursor:pointer;text-align:left;font-weight:500;min-height:44px}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:linear-gradient(90deg,var(--pur),var(--blue));color:#fff;box-shadow:0 0 0 2px rgba(165,180,252,.5),0 6px 18px rgba(47,107,255,.35)}
.nav.tch{border-color:var(--yel);color:var(--yel)}.nav.tch.on{color:#0b1d4f;background:var(--yel)}
.side-robot{margin-top:auto;background:rgba(255,255,255,.07);border-radius:16px;padding:10px;display:flex;gap:8px;align-items:center;font-size:12.5px;color:#dbe4ff}
.side-robot p{margin:0}
.main{padding:clamp(16px,3vw,36px);padding-bottom:110px;max-width:1280px;width:100%}
.foot{margin-top:40px;font-size:13px;color:var(--mut);text-align:center}
.bottom{display:none}.mtop{display:none}
.card{background:var(--card);border-radius:var(--r);padding:clamp(16px,2.2vw,24px);box-shadow:0 1px 0 var(--line),0 10px 30px rgba(11,29,79,.06);border:1px solid var(--line);margin-bottom:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.grid2>.card{margin-bottom:0}.grid2{margin-bottom:18px}.grid2.tight{gap:12px;margin:0}
.kicker{font-size:13px;font-weight:600;color:var(--pur);margin:0 0 4px}
.lede{color:var(--mut);max-width:70ch;margin:0}
.lab-head{margin-bottom:16px}
.btn{border:0;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(90deg,var(--pur),var(--blue));color:#fff;box-shadow:0 6px 16px rgba(91,33,182,.25)}
.btn.yellow{background:var(--yel);color:#0b1d4f}
.btn.ghost{background:#eef2ff;color:var(--blue2)}
.btn.danger{background:#fee2e2;color:#991b1b}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.big{min-height:50px;padding:12px 24px;font-size:17px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btnrow select{width:auto;flex:1 1 200px}
.hl{background:var(--yel2);border-left:5px solid var(--yel);padding:10px 12px;border-radius:10px;font-size:15px}
.warn{background:var(--badb);color:#78350f;padding:10px 12px;border-radius:10px;font-size:15px}
.okmsg{background:var(--goodb);color:#14532d;padding:10px 12px;border-radius:10px;font-size:15px}
.okt{color:var(--good)}.badt{color:#b91c1c}
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:#eef2ff;color:var(--blue2);vertical-align:middle}
.pill.good{background:var(--goodb);color:var(--good)}.pill.bad{background:#fee2e2;color:#b91c1c}
.count{font-size:13px;font-weight:600;color:var(--pur);background:#f3e8ff;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.tag{font-size:12px;font-weight:600;background:#eef2ff;color:var(--blue2);border-radius:8px;padding:2px 8px;margin-left:8px;white-space:nowrap}
.tag.rules{background:#f3e8ff;color:var(--pur2)}
.field{display:block;font-weight:500;margin:10px 0;font-size:15px}.field>input,.field>select,.field>textarea{margin-top:6px}
/* hero */
.hero{position:relative;display:grid;grid-template-columns:220px minmax(0,1fr) 260px;gap:20px;align-items:center;background:radial-gradient(circle at 80% 10%,#e9ddff,transparent 50%),radial-gradient(circle at 10% 90%,#dbe7ff,transparent 55%),#fff;border:1px solid var(--line);border-radius:28px;padding:clamp(16px,3vw,30px);overflow:hidden}
.hero::after{content:"+  −  ×  ÷  =  x  y  ∑  π";position:absolute;right:20px;bottom:6px;font-size:22px;letter-spacing:10px;color:#c7d2fe;pointer-events:none;font-weight:700}
.hero-persona{position:relative}
.hero-persona img{width:100%;border-radius:22px;display:block;box-shadow:0 12px 28px rgba(11,29,79,.2)}
.badge{position:absolute;left:8px;right:8px;bottom:-12px;background:#0b1d4f;color:#fff;border:2px solid #5ef0ff;border-radius:999px;font-weight:700;font-size:14px;text-align:center;padding:6px}
.title{font-size:clamp(40px,6vw,64px);font-weight:800;letter-spacing:-.02em;line-height:1;margin:0}
.title em{font-style:normal;color:var(--yel);-webkit-text-stroke:1.5px #0b1d4f;paint-order:stroke}
.title span{display:block;font-size:clamp(20px,2.6vw,28px);font-weight:700;color:#fff;background:linear-gradient(90deg,var(--pur),var(--blue));border-radius:999px;padding:6px 18px;width:fit-content;margin-top:10px;letter-spacing:0}
.tagline{display:inline-block;background:var(--yel2);border:2px solid var(--yel);border-radius:999px;padding:6px 16px;font-weight:600;font-style:italic;margin:16px 0}
.start{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px;align-items:end}
.start label{font-weight:500;font-size:14px}.start label>*{margin-top:4px}
.robot-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.bubble{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 14px;box-shadow:0 8px 20px rgba(11,29,79,.08);position:relative;max-width:260px}
.bubble p{margin:2px 0 0;font-weight:500;font-size:15px}
.bubble-state{font-size:12px;font-weight:700;color:var(--pur)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:22px 0}
.mode{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;text-align:left;border-radius:24px;padding:20px;cursor:pointer;border:2px solid;transition:transform .2s,box-shadow .2s;background:#fff}
.mode:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(91,33,182,.15)}
.mode.m1{border-color:#c4b5fd;background:linear-gradient(160deg,#fff,#f5efff)}.mode.m2{border-color:#93c5fd;background:linear-gradient(160deg,#fff,#eaf4ff)}
.mode-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--pur),#9d6bff)}.m2 .mode-ic{background:linear-gradient(135deg,var(--blue2),var(--blue))}
.mode small{display:block;color:var(--pur);font-weight:700}.mode b{display:block;font-size:22px;margin-bottom:4px}
.mode code{display:block;width:fit-content;max-width:100%;margin-top:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;font-family:"JetBrains Mono",monospace;font-size:14px}
.mode .go{grid-column:1/-1;justify-self:stretch;text-align:center;background:linear-gradient(90deg,var(--pur),var(--blue));color:#fff;border-radius:999px;padding:10px;font-weight:700}.m2 .go{background:linear-gradient(90deg,var(--blue2),var(--blue))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.stats.wide{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px}
.stat{background:#f4f6ff;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.stat-l{font-size:13px;color:var(--mut)}.stat-v{font-size:22px;font-weight:700;line-height:1.2}.stat-s{font-size:12px;color:var(--mut)}
.stat.good{background:var(--goodb)}.stat.good .stat-v{color:var(--good)}.stat.bad{background:#fee2e2}.stat.bad .stat-v{color:#b91c1c}
/* tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px 8px 8px;min-height:44px;cursor:pointer;font-weight:600;color:var(--mut)}
.tab-k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eef2ff;color:var(--blue2);font-size:14px}
.tab.on{border-color:var(--pur);color:var(--ink);box-shadow:0 4px 14px rgba(124,58,237,.18)}.tab.on .tab-k{background:var(--pur);color:#fff}
.tab.done .tab-k{background:var(--good);color:#fff}
.row-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;margin:12px 0}
.row-form label{font-size:14px;font-weight:500}.row-form input{margin-top:4px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}
.tbl th{font-size:13px;color:var(--mut);font-weight:600;text-align:left;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .act{white-space:nowrap;text-align:right}.tbl .act .btn{margin-left:4px}
.tbl .empty{text-align:center;color:var(--mut);padding:18px}
.tbl tr.cur{background:#f5f3ff}
.tbl.ws th{background:#ede9fe;color:var(--ink);border:1px solid #ddd6fe}.tbl.ws td{text-align:center;border:1px solid #ddd6fe;font-weight:600;min-width:44px}
.cell{min-height:36px;padding:6px 8px;width:90px}
.ans{display:flex;gap:6px;align-items:center}
.plot{margin:6px 0}.plot svg{display:block}
.grid{stroke:#e8ecf8}.axis{stroke:#94a3b8;stroke-width:1.5}.tick{font-size:12px;fill:var(--mut)}.axl{font-size:12.5px;fill:var(--mut)}
.curve{fill:none;stroke:var(--pur);stroke-width:3;stroke-linecap:round}
.pt.train{fill:var(--blue);stroke:#fff;stroke-width:2}.pt.expected{fill:#fff;stroke:var(--ink);stroke-width:2.5}.pt.pred{fill:var(--yel);stroke:#0b1d4f;stroke-width:1.5}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mut)}
.lg{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.lg.train{background:var(--blue)}.lg.expected{border:2.5px solid var(--ink)}.lg.pred{background:var(--yel);border:1.5px solid #0b1d4f;border-radius:2px;transform:rotate(45deg)}.lg.line{background:var(--pur);height:4px;border-radius:2px;vertical-align:3px;width:18px}
.choices{border:0;padding:0;margin:8px 0}.choices legend{font-weight:600;margin-bottom:6px}
.choice{display:flex;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.choice.on{border-color:var(--pur);background:#faf7ff}.choice input{width:auto;min-height:0;margin-top:4px}
.lvl{font-style:normal;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--goodb);color:var(--good)}.lvl.advanced{background:#f3e8ff;color:var(--pur2)}.lvl.optional{background:#e0f2fe;color:#075985}
.inline{display:flex;gap:8px;align-items:center;font-weight:500}.inline select{width:auto}
.progress{height:12px;background:#eef2ff;border-radius:999px;overflow:hidden;margin:14px 0 4px}
.bar{height:100%;background:linear-gradient(90deg,var(--pur),var(--blue));border-radius:999px;transition:width .2s}
.bar.indet{width:40%!important;animation:indet 1s infinite ease-in-out}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.explain{background:#f8f7ff;border-radius:14px;padding:14px;margin-top:10px}
.locked{text-align:center;padding:36px}
.perf{display:grid;gap:12px}.perf>div{border:1.5px solid var(--line);border-radius:14px;padding:12px}
.reveal{margin-top:14px}
.equation{margin-top:12px;font:700 clamp(24px,4vw,34px)/1.2 "JetBrains Mono",monospace;background:#0b1d4f;color:var(--yel);border-radius:16px;padding:16px 18px;animation:pop .4s}
.equation small{display:block;font:500 13px Lexend,sans-serif;color:#c7d2fe;margin-top:6px}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.compare{display:flex;align-items:center;gap:14px;margin:14px 0;flex-wrap:wrap}.compare>div{display:flex;flex-direction:column;background:#f4f6ff;border-radius:14px;padding:10px 14px;flex:1 1 180px}.compare .arrow{flex:none;background:none;font-size:24px;color:var(--pur)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.chip{border:1.5px solid #c4b5fd;background:#faf7ff;color:var(--pur2);border-radius:999px;padding:6px 12px;min-height:38px;cursor:pointer;font-weight:600}
.chip:hover{background:#f3e8ff}
.guide{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,#eef2ff,#f5efff);border-radius:16px;padding:12px;margin-top:14px;font-size:15px}
.guide img{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:50% 12%;border:3px solid #fff;flex:none;box-shadow:0 3px 10px rgba(11,29,79,.15)}
.guide strong{color:var(--pur)}
/* rules */
.block{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-radius:14px;padding:10px 12px;margin:8px 0;border-left:8px solid}
.block select,.block input{width:auto;flex:1 1 120px}
.bk{font-weight:700;font-size:14px;flex:none}
.b-if{background:var(--yel2);border-color:var(--yel)}.b-and{background:#fff1e6;border-color:#fb923c}.b-then{background:#e0ecff;border-color:var(--blue)}.b-res{background:#f3e8ff;border-color:var(--pur)}
.sentence{font-weight:600;background:#f4f6ff;border-radius:12px;padding:10px 12px}
.rules{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.rule{border:1.5px solid var(--line);border-radius:14px;padding:12px}.rule p{margin:6px 0}
.rule.off{opacity:.6;background:#f8fafc}.rule.okb{border-color:#86efac}.rule.badb{border-color:#fca5a5}
.rule-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.switch{display:inline-flex;gap:6px;align-items:center;font-weight:600;font-size:14px}.switch input{width:20px;min-height:20px}
.checks{list-style:none;padding:0;margin:6px 0;font-size:14px}.checks .ok{color:var(--good)}.checks .no{color:#b91c1c}
.empty-box{color:var(--mut);background:#f8f9ff;border:1.5px dashed var(--line);border-radius:14px;padding:16px;margin:0}
.big-in{font-size:22px!important;min-height:54px}
.keypad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}
.key{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:18px;cursor:pointer}
.key.op{background:#eef2ff;color:var(--blue2)}.key:active{transform:scale(.96)}
.steps{display:grid;gap:10px}
.step{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;animation:pop .3s}
.step.start{background:#f4f6ff}.step.bad{border-color:#fca5a5;background:#fff5f5}
.eqbig{font-size:22px;font-weight:700}
.final{border-radius:14px;padding:14px;display:grid;gap:6px}.final.good{background:var(--goodb);color:#14532d}.final.bad{background:#fee2e2;color:#7f1d1d}.final.miss{background:var(--yel2);border:2px solid var(--yel)}
.final .btn{justify-self:start}
.flag{display:grid;gap:6px}
.timeline{list-style:none;padding:0;margin:0;display:grid;gap:8px;max-height:480px;overflow:auto}
.timeline li{border-bottom:1px solid var(--line);padding-bottom:8px;font-size:14.5px}.timeline time{display:block;font-size:12px;color:var(--mut)}.timeline .tag{margin:0 6px 0 0}
.plain{padding-left:18px;margin:0 0 10px}.plain li{margin:6px 0}
/* knowledge */
.kmap{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center}
.kcol{display:grid;gap:10px}.kcol h3{font-size:13px;color:var(--mut)}
.karrow{font-size:28px;color:#a5b4fc;text-align:center}
.node{border-radius:16px;padding:12px 14px;border:2px solid;display:grid;gap:2px;position:relative}
.node b{font-size:16px}.node small{color:inherit;opacity:.8}.node span{font-size:12.5px;font-weight:700}
.node.not{border-style:dashed;border-color:#cbd5e1;color:#64748b;background:#f8fafc}
.node.taught{border-color:var(--blue);background:#eaf1ff;color:var(--blue2)}
.node.success{border-color:#22c55e;background:var(--goodb);color:#14532d;box-shadow:0 0 0 4px rgba(34,197,94,.15)}
.node.needs{border-color:#f59e0b;background:var(--badb);color:#78350f}
.legend.k{margin-top:14px}.dot{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;border:2px solid}
.dot.not{border-style:dashed;border-color:#94a3b8}.dot.taught{background:#eaf1ff;border-color:var(--blue)}.dot.success{background:var(--goodb);border-color:#22c55e}.dot.needs{background:var(--badb);border-color:#f59e0b}
/* activity */
.sheet-head{display:flex;gap:16px;align-items:center;background:linear-gradient(110deg,#0b1d4f,#2a1a6b 60%,#3b2bb5);color:#fff;border-radius:24px;padding:18px;margin-bottom:16px}
.sheet-head .lede{color:#dbe4ff}.sheet-head .kicker{color:var(--yel)}
.sheet-persona{width:92px;height:92px;border-radius:50%;object-fit:cover;object-position:50% 10%;border:3px solid #5ef0ff;flex:none}
.stepper{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:16px}
.stepper-bar{height:10px;background:#eef2ff;border-radius:999px;overflow:hidden}.stepper-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pur),var(--blue));transition:width .4s}
.stepper ol{list-style:none;padding:0;margin:12px 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;font-size:13.5px}
.stepper li{display:flex;gap:6px;align-items:flex-start;color:var(--mut)}.stepper li span{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#eef2ff;font-weight:700;color:var(--blue2);font-size:13px}
.stepper li.done{color:var(--ink)}.stepper li.done span{background:var(--good);color:#fff}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.acts .card{margin:0}.acts .wide{grid-column:1/-1}
.act h2{display:flex;align-items:center;gap:10px}.num{width:34px;height:34px;border-radius:50%;background:var(--pur);color:#fff;display:grid;place-items:center;font-size:17px;flex:none}
.act.ok{border-color:#86efac}.act.ok .num{background:var(--good)}
.radios{border:0;padding:0;margin:10px 0}.radios legend{font-weight:500;margin-bottom:6px}.radios label{display:flex;gap:8px;align-items:center;margin:4px 0;min-height:36px}.radios input{width:20px;min-height:20px}
.checks-f{border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;margin:12px 0}.checks-f legend{font-weight:600;padding:0 6px}.checks-f label{display:flex;gap:8px;align-items:center;min-height:38px}.checks-f input{width:20px;min-height:20px;flex:none}
/* dock */
.dock{position:fixed;right:18px;bottom:18px;display:flex;align-items:flex-end;gap:10px;z-index:20;pointer-events:none}
.dock .robot-wrap{flex-direction:row-reverse;align-items:flex-end;pointer-events:auto}.dock .bubble{max-width:240px;font-size:14px}.dock .bubble p{font-size:14px}
.dock-btn{background:none;border:0;padding:0;cursor:pointer;text-align:left;pointer-events:auto}.dock.closed .bubble{display:none}
.preview-bar{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--yel);color:#0b1d4f;font-weight:600;padding:8px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.preview-bar~.side,.preview-bar~.main{margin-top:52px}
.modal-bg{position:fixed;inset:0;background:rgba(11,29,79,.45);display:grid;place-items:center;z-index:60;padding:12px}
.modal{background:#fff;border-radius:20px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal.wide{width:min(860px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h3{margin:0;font-size:19px}
.out{margin-top:10px;font-size:13px}
.report-frame{width:100%;height:60vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0b1d4f;color:#fff;padding:10px 18px;border-radius:999px;z-index:70;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25)}
/* robot animation */
.float{animation:float 3.2s ease-in-out infinite;transform-origin:center}
@keyframes float{50%{transform:translateY(-4px)}}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.r-training .bulb{animation:pulse .6s infinite alternate}.scan{animation:scan .8s infinite alternate}
@keyframes pulse{to{opacity:.3}}@keyframes scan{to{transform:translateX(4px)}}
.r-correct .arm,.r-improved .arm{animation:wave .6s 2;transform-box:fill-box;transform-origin:top}
@keyframes wave{50%{transform:rotate(30deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* responsive */
@media (min-width:901px){.dock{display:none}}
@media (max-width:1100px){.hero{grid-template-columns:180px minmax(0,1fr)}.hero-robot{grid-column:1/-1}.hero-robot .robot-wrap{flex-direction:row;justify-content:center}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}.side{display:none}
  .bottom{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:#0b1d4f;z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom button{background:none;border:0;color:#c7d2fe;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;min-height:50px;border-radius:12px;cursor:pointer}
  .bottom button.on{color:#0b1d4f;background:var(--yel)}
  .grid2,.acts,.modes{grid-template-columns:minmax(0,1fr)}
  .main{padding-bottom:150px}
  .mtop{display:flex;align-items:center;gap:10px;margin:-4px 0 14px;font-size:15px}.mtop .mark{width:36px;height:36px}
  .dock{left:8px;right:8px;bottom:70px}.dock .robot-wrap{width:100%;justify-content:flex-end}
  .kmap{grid-template-columns:minmax(0,1fr)}.karrow{transform:rotate(90deg)}
  .stepper ol{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .hero{grid-template-columns:minmax(0,1fr);text-align:left}.hero-persona{display:flex;align-items:center;gap:12px;order:2}.hero-persona img{width:84px;height:84px;object-fit:cover;object-position:50% 8%;border-radius:50%;border:3px solid #5ef0ff}.badge{position:static;font-size:13px;padding:6px 12px;width:auto}.hero-main{order:1}.hero-robot{order:3}
  .start{grid-template-columns:minmax(0,1fr)}
  .row-form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.row-form .btn{grid-column:1/-1}
  .hero::after{display:none}
  table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start!important}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut);font-size:12px}.stack td:empty{display:none}
  .dock .bubble{max-width:200px}.dock svg{width:48px;height:56px}
  .sheet-persona{width:64px;height:64px}
}
@media print{
  body.printing *{visibility:hidden}
  body.printing .print-area,body.printing .print-area *{visibility:visible}
  body.printing .print-area{position:absolute;inset:0}
  body.printing .report-frame{height:auto;min-height:100vh;border:0}
}

.start.cloud{grid-template-columns:repeat(2,minmax(0,1fr))}.start .full{grid-column:1/-1;margin:0}
.signed{background:#f4f6ff;border-radius:16px;padding:14px}.signed p{margin:0}
.savebar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--goodb);color:#14532d;border-radius:12px;padding:8px 14px;margin-bottom:14px;font-size:14px}
.savebar.saving{background:#eef2ff;color:var(--blue2)}.savebar.error{background:var(--badb);color:#78350f}
.setup ol>li{margin:10px 0}.setup pre{background:#0b1d4f;color:#e0e7ff;border-radius:12px;padding:12px;font-size:12.5px;overflow:auto;max-height:280px}
.classes{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.classes .chip.on{background:var(--pur);color:#fff;border-color:var(--pur)}
@media (max-width:600px){.start.cloud{grid-template-columns:minmax(0,1fr)}}
.narrow{max-width:460px}.sec{margin:26px 0 12px}details.card summary{cursor:pointer;min-height:28px}
